name: Verificar aplicação
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/copy-assets.mjs
      - run: node scripts/run.mjs build
      - run: node scripts/check-repository.mjs
      - run: node scripts/restore-model.mjs
      - run: node scripts/test-selection.mjs
      - run: node scripts/test-doors.mjs
      - run: node scripts/test-windows.mjs
      - run: node scripts/test-appearance.mjs
